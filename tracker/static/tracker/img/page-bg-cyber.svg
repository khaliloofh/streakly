<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="cyberGlow1" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#0066ff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#080b11" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyberGlow2" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080b11" stop-opacity="0" />
    </radialGradient>
    <pattern id="cyberGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#00f2fe" stroke-width="0.75" stroke-opacity="0.05" />
    </pattern>
    <linearGradient id="cyberBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="50%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#0c1421" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#cyberBase)" />

  <!-- Ambient Glows -->
  <rect width="100%" height="100%" fill="url(#cyberGlow1)" />
  <rect width="100%" height="100%" fill="url(#cyberGlow2)" />

  <!-- Tech Grid -->
  <rect width="100%" height="100%" fill="url(#cyberGrid)" />

  <!-- Subtle Perspective Accents -->
  <path d="M 600,0 L 1920,850 M 900,0 L 1920,600 M 1200,0 L 1920,400" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.04" />
  <circle cx="1600" cy="220" r="180" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.07" stroke-dasharray="8 12" />
  <circle cx="1600" cy="220" r="90" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.1" />
</svg>
