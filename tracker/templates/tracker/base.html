<!DOCTYPE html>
<html>
<head>
    <title>Streakly{% block title_suffix %}{% endblock %}</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --bg-sidebar: #111111;
            --bg-card: #161616;
            --bg-input: #1c1c1c;
            --border: #2a2a2a;
            --text: #e4e2dd;
            --text-dim: #5c5c5c;
            --accent: #CC785C;
            --accent-glow: rgba(204, 120, 92, 0.55);
            --ok: #4fd1a0;
            --off: #2a2a2a;
            --danger: #e2574c;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', monospace;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 200px;
            flex-shrink: 0;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
        }

        .sidebar .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
            text-shadow: 0 0 12px var(--accent-glow);
            letter-spacing: 1px;
            margin-bottom: 28px;
            padding-left: 6px;
        }

        .nav-link {
            display: block;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 9px 12px;
            border-radius: 6px;
            margin-bottom: 4px;
            border: 1px solid transparent;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }

        .nav-link:hover {
            color: var(--text);
            border-color: var(--border);
        }

        .nav-link.active {
            color: var(--accent);
            background: rgba(204, 120, 92, 0.08);
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(204, 120, 92, 0.15);
        }

        .main {
            flex: 1;
            padding: 32px 36px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 720px) {
            .layout { flex-direction: column; }
            .sidebar {
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
                padding: 12px;
                gap: 6px;
            }
            .sidebar .logo { display: none; }
            .nav-link { margin-bottom: 0; white-space: nowrap; }
            .main { padding: 20px; max-width: 100%; margin: 0; }
        }

        h2 {
            color: var(--text-dim);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 30px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 10px;
        }

        a.link {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 3px 8px;
            transition: color 0.15s, border-color 0.15s;
        }

        a.link:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        button, .btn {
            background: var(--accent);
            color: #0d0d0d;
            border: none;
            border-radius: 6px;
            padding: 9px 18px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
            transition: box-shadow 0.15s, transform 0.15s;
            text-decoration: none;
            display: inline-block;
        }

        button:hover, .btn:hover {
            box-shadow: 0 0 18px var(--accent-glow);
            transform: translateY(-1px);
        }

        button.danger {
            background: var(--danger);
            box-shadow: 0 0 10px rgba(226, 87, 76, 0.4);
        }

        .toast-wrap {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 999;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--ok);
            color: var(--ok);
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 0.85rem;
            box-shadow: 0 0 14px rgba(79, 209, 160, 0.35);
            opacity: 1;
            transition: opacity 0.6s ease;
        }

        .toast.fade-out { opacity: 0; }

        {% block extra_style %}{% endblock %}
    </style>
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="logo">streakly_</div>
            <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="{% url 'home' %}">Dashboard</a>
            <a class="nav-link {% if active_page == 'tasks' %}active{% endif %}" href="{% url 'tasks' %}">Tasks</a>
            <a class="nav-link {% if active_page == 'calendar' %}active{% endif %}" href="{% url 'calendar' %}">Calendar</a>
            <a class="nav-link {% if active_page == 'statistics' %}active{% endif %}" href="{% url 'statistics' %}">Statistics</a>
            <a class="nav-link {% if active_page == 'history' %}active{% endif %}" href="{% url 'history' %}">History</a>
            <a class="nav-link {% if active_page == 'settings' %}active{% endif %}" href="{% url 'settings' %}">Settings</a>
        </div>
        <div class="main">
            {% block content %}{% endblock %}
        </div>
    </div>

    {% if messages %}
    <div class="toast-wrap" id="toast-wrap">
        {% for message in messages %}
            <div class="toast">{{ message }}</div>
        {% endfor %}
    </div>
    <script>
        setTimeout(function () {
            var wrap = document.getElementById('toast-wrap');
            if (!wrap) return;
            wrap.querySelectorAll('.toast').forEach(function (t) {
                t.classList.add('fade-out');
            });
            setTimeout(function () { wrap.remove(); }, 600);
        }, 3000);
    </script>
    {% endif %}
</body>
</html>
