<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="monoGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090909" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="monoBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070707" />
      <stop offset="50%" stop-color="#0c0c0c" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <pattern id="monoLines" width="60" height="60" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.025" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#monoBase)" />
  <rect width="100%" height="100%" fill="url(#monoGlow)" />
  <rect width="100%" height="100%" fill="url(#monoLines)" />

  <g fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04">
    <rect x="1350" y="80" width="280" height="280" />
    <rect x="1410" y="140" width="160" height="160" />
    <line x1="1350" y1="80" x2="1410" y2="140" />
    <line x1="1630" y1="80" x2="1570" y2="140" />
    <line x1="1630" y1="360" x2="1570" y2="300" />
    <line x1="1350" y1="360" x2="1410" y2="300" />
  </g>
</svg>
